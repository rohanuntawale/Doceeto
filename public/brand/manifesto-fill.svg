<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 260" width="1800" height="260" role="presentation">
  <!--
    Fill for the masked manifesto heading.

    Two constraints shape it. The heading box is a wide strip (~7:1) and the
    media is object-fit: cover, so the artwork matches that aspect — a taller
    canvas would crop to its middle band and only that band would ever be
    seen. And the words sit on the forest band, so the palette stays
    bone-dominant: mint, sage and brand gold drift through the letters as the
    media parallaxes, but nothing goes dark enough to dim a word.

    Swap this file (or the `src` prop) for a photograph or video whenever
    there is real footage to put behind the words.
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#F6F4EC" />
      <stop offset="50%" stop-color="#EAE8DC" />
      <stop offset="100%" stop-color="#E4EADC" />
    </linearGradient>

    <radialGradient id="mint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FCDB4" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#8FCDB4" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#8FCDB4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6AF4E" stop-opacity="0.80" />
      <stop offset="58%" stop-color="#D6AF4E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#D6AF4E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sage" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FB393" stop-opacity="0.55" />
      <stop offset="62%" stop-color="#7FB393" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#7FB393" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFEF8" stop-opacity="1" />
      <stop offset="65%" stop-color="#FFFEF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFEF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1800" height="260" fill="url(#base)" />

  <ellipse cx="120" cy="60" rx="420" ry="220" fill="url(#bone)" />
  <ellipse cx="470" cy="210" rx="420" ry="230" fill="url(#mint)" />
  <ellipse cx="820" cy="40" rx="380" ry="200" fill="url(#gold)" />
  <ellipse cx="1120" cy="230" rx="400" ry="220" fill="url(#bone)" />
  <ellipse cx="1420" cy="70" rx="400" ry="220" fill="url(#sage)" />
  <ellipse cx="1720" cy="200" rx="380" ry="210" fill="url(#mint)" />
  <ellipse cx="640" cy="130" rx="260" ry="150" fill="url(#bone)" />
</svg>
