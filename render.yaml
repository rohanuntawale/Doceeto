# Render blueprint — deploy the Iyashi dashboard as a Node web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: iyashi-dashboard
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Live mode (optional — omit for zero-setup demo mode).
      - key: NEXT_PUBLIC_BACKEND
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SETUP_TOKEN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
